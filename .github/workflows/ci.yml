name: ci
on:
  push:
    branches: [staging, main]

env:
  GIT_SHA: ${{ github.sha }}
  REGISTRY: ghcr.io
  IMAGE_PREFIX: accountable-tsl/accountable-books
  APP_NAME: Accountable Books
  ENVIRONMENT: staging

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Validate API contracts
        run: pnpm run validate-contracts:ci

      - name: Generate types from contracts
        run: pnpm run codegen

  quality:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Generate types (required for typecheck)
        run: pnpm run codegen

      - name: Format generated files
        run: pnpm run format packages/api-types/src/generated/

      - name: Build shared packages for typecheck
        run: pnpm --filter @accountable-books/utils build

      - name: Lint workspace
        run: pnpm run lint

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    needs: contracts
    strategy:
      matrix:
        package: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Generate types (required for builds)
        run: pnpm run codegen

      - name: Format generated files
        run: pnpm run format packages/api-types/src/generated/

      - name: Build shared packages (api-types, utils)
        run: pnpm --filter @accountable-books/api-types build && pnpm --filter @accountable-books/utils build

      - name: Generate environment files
        run: pnpm --filter @accountable-books/${{ matrix.package }} generate-env

      - name: Build ${{ matrix.package }}
        run: pnpm --filter @accountable-books/${{ matrix.package }} build

      - name: Test ${{ matrix.package }}
        run: pnpm --filter @accountable-books/${{ matrix.package }} test -- --run

      # Optional: Sentry sourcemaps (enable once secrets exist)
      # - name: Upload Sentry sourcemaps
      #   env:
      #     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      #     SENTRY_ORG: your-org
      #     SENTRY_PROJECT: node-express
      #     SENTRY_RELEASE: ${{ github.sha }}
      #   run: |
      #     sentry-cli releases new "$SENTRY_RELEASE"
      #     sentry-cli releases files "$SENTRY_RELEASE" upload-sourcemaps apps/api/dist --rewrite
      #     sentry-cli releases finalize "$SENTRY_RELEASE"

  ml-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "poetry==1.8.3"

      - name: Install dependencies (ml-engine)
        working-directory: apps/ml-engine
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run tests (ml-engine)
        working-directory: apps/ml-engine
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/ml-engine
        run: poetry run pytest -q

  build_and_push_images:
    runs-on: ubuntu-latest
    needs: [quality, test, ml-engine]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Turbo prune per app (lean build contexts)
        run: |
          pnpm dlx turbo prune --scope=@accountable-books/api --docker --out-dir .pruned/api
          pnpm dlx turbo prune --scope=@accountable-books/web --docker --out-dir .pruned/web
          pnpm dlx turbo prune --scope=@accountable-books/ml-engine --docker --out-dir .pruned/ml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push API
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/infra/docker/Dockerfile
          build-args: |
            APP_DIR=.pruned/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ env.GIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push WEB
      - name: Build and push WEB image (Nginx + SPA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/infra/docker/Dockerfile
          build-args: |
            APP_DIR=.pruned/web
            VITE_BACKEND_URL=/api
            VITE_API_URL=/api
            VITE_APP_NAME=${{ env.APP_NAME }}
            VITE_ENVIRONMENT=${{ env.ENVIRONMENT }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ env.GIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push ML
      - name: Build and push ML image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ml-engine/infra/docker/Dockerfile
          build-args: |
            APP_DIR=.pruned/ml
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ml:${{ env.GIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
