name: ci
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Validate API contracts
        run: pnpm run validate-contracts:ci

      - name: Generate types from contracts
        run: pnpm run codegen

  quality:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Generate types (required for typecheck)
        run: pnpm run codegen

      - name: Format generated files
        run: pnpm run format packages/api-types/src/generated/

      - name: Lint workspace
        run: pnpm run lint

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    needs: contracts
    strategy:
      matrix:
        package: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Generate types (required for builds)
        run: pnpm run codegen

      - name: Format generated files
        run: pnpm run format packages/api-types/src/generated/

      - name: Build api-types package
        run: pnpm --filter @accountable-books/api-types build

      - name: Build ${{ matrix.package }}
        run: pnpm --filter @accountable-books/${{ matrix.package }} build

      - name: Test ${{ matrix.package }}
        run: pnpm --filter @accountable-books/${{ matrix.package }} test -- --run

      # Optional: Sentry sourcemaps (enable once secrets exist)
