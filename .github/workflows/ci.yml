name: CI
on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

env:
  PNPM_VERSION: 11.3.0

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Build shared packages for typecheck
        run: pnpm --filter @accountable-books/utils build

      # Contracts generation
      - name: 'Contracts: build generated artifacts'
        run: pnpm --filter @accountable-books/contracts build

      - name: Lint workspace
        run: pnpm run lint

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, web]

    services:
      postgres:
        image: iamtemi/accountable:pg17-cron-vector-v1
        env:
          POSTGRES_DB: accountable_books
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      redis:
        image: redis:8.0-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Build shared packages (utils)
        run: pnpm --filter @accountable-books/utils build

      - name: Build contracts artifacts
        run: pnpm --filter @accountable-books/contracts build

      - name: Generate environment files
        run: pnpm --filter @accountable-books/${{ matrix.package }} generate-env

      - name: Create test database
        if: matrix.package == 'api'
        run: |
          PGPASSWORD=password psql -h localhost -p 5433 -U user -d accountable_books -c "CREATE DATABASE accountable_books_test;"
        continue-on-error: true

      - name: Run database migrations
        if: matrix.package == 'api'
        run: pnpm --filter @accountable-books/api run migrate:test

      - name: Bootstrap catalog for API tests
        if: matrix.package == 'api'
        run: pnpm --filter @accountable-books/api run bootstrap:test

      - name: Seed demo data for API tests
        if: matrix.package == 'api'
        run: NODE_ENV=test pnpm --filter @accountable-books/api run demo apply

      - name: Validate billing catalog v1 seed snapshot
        if: matrix.package == 'api'
        run: |
          pnpm --filter @accountable-books/api billing:validate-catalog-seed

      - name: Build ${{ matrix.package }}
        run: pnpm --filter @accountable-books/${{ matrix.package }} build

      - name: Test ${{ matrix.package }}
        run: pnpm --filter @accountable-books/${{ matrix.package }} test --run

      - name: Verify API worker database isolation
        if: matrix.package == 'api'
        run: pnpm --filter @accountable-books/api run test:parallel-isolation

      # Optional: Sentry sourcemaps (enable once secrets exist)
      # - name: Upload Sentry sourcemaps
      #   env:
      #     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      #     SENTRY_ORG: your-org
      #     SENTRY_PROJECT: node-express
      #     SENTRY_RELEASE: ${{ github.sha }}
      #   run: |
      #     sentry-cli releases new "$SENTRY_RELEASE"
      #     sentry-cli releases files "$SENTRY_RELEASE" upload-sourcemaps apps/api/dist --rewrite
      #     sentry-cli releases finalize "$SENTRY_RELEASE"

  ml-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: 'pnpm'

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Generate contracts artifacts required by ml-engine tests
        run: pnpm --filter @accountable-books/contracts build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies (ml-engine)
        working-directory: apps/ml-engine
        run: uv sync --frozen

      - name: Run tests (ml-engine)
        working-directory: apps/ml-engine
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/ml-engine
        run: uv run pytest -q
