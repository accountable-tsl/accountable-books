name: Deploy Staging
on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      skip_demo_seed:
        description: 'Skip demo data seeding'
        required: false
        default: false
        type: boolean

env:
  PNPM_VERSION: 11.3.0
  NODE_VERSION: 24.16.0

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # Step 0: On staging pushes, wait for CI on the same commit before deploying.
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure staging ref
        run: |
          if [ "${{ github.ref_name }}" != "staging" ]; then
            echo "❌ Staging deploys must run from the staging branch."
            echo "Current ref: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Wait for CI workflow
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "⏳ Waiting for CI to pass on ${{ github.sha }}..."
          for attempt in {1..60}; do
            result="$(gh run list \
              --workflow "CI" \
              --branch "${{ github.ref_name }}" \
              --commit "${{ github.sha }}" \
              --json status,conclusion \
              --jq '.[0] | if . == null then "pending" elif .status == "completed" then .conclusion else .status end')"

            echo "Attempt $attempt/60: CI status is $result"

            if [ "$result" = "success" ]; then
              echo "✅ CI passed"
              exit 0
            fi

            if [ "$result" = "failure" ] || \
               [ "$result" = "cancelled" ] || \
               [ "$result" = "timed_out" ] || \
               [ "$result" = "action_required" ]; then
              echo "❌ CI completed with status: $result"
              exit 1
            fi

            sleep 10
          done

          echo "❌ Timed out waiting for CI"
          exit 1

      - name: Skip CI wait for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual staging deploy requested; skipping CI wait."

  # Step 1: Run database migrations BEFORE deploying API
  run-migrations:
    runs-on: ubuntu-latest
    needs: wait-for-ci
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @accountable-books/utils build

      - name: 'Contracts: Generate Pydantic models'
        run: pnpm --filter @accountable-books/contracts build

      - name: Generate environment files
        run: pnpm --filter @accountable-books/api generate-env

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DIRECT_URL }}
          DATABASE_URL_NOPOOL: ${{ secrets.NEON_STAGING_DIRECT_URL }}
        run: |
          echo "🔄 Running database migrations on staging..."
          pnpm -F @accountable-books/api run migrate:staging:remote
          echo "✅ Database migrations completed successfully"

      - name: Bootstrap application workspaces
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DIRECT_URL }}
          DATABASE_URL_NOPOOL: ${{ secrets.NEON_STAGING_DIRECT_URL }}
        run: |
          echo "🔄 Bootstrapping application workspaces..."
          pnpm -F @accountable-books/api run bootstrap:staging:remote
          echo "✅ Workspace bootstrap completed"

  # Step 2: Deploy API only after migrations succeed
  deploy-api:
    runs-on: ubuntu-latest
    needs: run-migrations
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @accountable-books/utils build

      - name: 'Contracts: Generate Pydantic models'
        run: pnpm --filter @accountable-books/contracts build

      - name: Generate environment files
        run: pnpm --filter @accountable-books/api generate-env

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy API to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "🚀 Deploying API to Fly.io..."
          flyctl deploy \
            --app accountable-books-api-staging \
            --config fly.staging.toml \
            --strategy immediate
          echo "✅ API deployment completed"

      - name: Wait for API to be healthy
        run: |
          echo "⏳ Waiting for API health check..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f https://accountable-books-api-staging.fly.dev/health/ready; then
              echo "✅ API is healthy"
              break
            fi
            echo "Attempt $((attempt + 1))/$max_attempts: API not ready yet..."
            sleep 10
            attempt=$((attempt + 1))
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ API health check failed after $max_attempts attempts"
            exit 1
          fi

  # Step 2b: Deploy ML Engine in parallel with API (independent services)
  deploy-ml-engine:
    runs-on: ubuntu-latest
    needs: run-migrations
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy ML Engine to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "🚀 Deploying ML Engine to Fly.io..."
          flyctl deploy \
            --app accountable-books-ml-engine-staging \
            --config fly.ml-staging.toml \
            --strategy immediate
          echo "✅ ML Engine deployment completed"

      - name: Wait for ML Engine to be healthy
        run: |
          echo "⏳ Waiting for ML Engine health check..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f https://accountable-books-ml-engine-staging.fly.dev/health; then
              echo "✅ ML Engine is healthy"
              break
            fi
            echo "Attempt $((attempt + 1))/$max_attempts: ML Engine not ready yet..."
            sleep 10
            attempt=$((attempt + 1))
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ ML Engine health check failed after $max_attempts attempts"
            exit 1
          fi

  # Step 3: Deploy Frontend to Vercel only after API is healthy
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [run-migrations, deploy-api, deploy-ml-engine]
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @accountable-books/utils build

      - name: Build contracts artifacts
        run: pnpm --filter @accountable-books/contracts build

      - name: Generate environment files
        run: pnpm --filter @accountable-books/web generate-env

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'

  # Step 4: Apply demo data only after both API and frontend are deployed
  apply-demo-data:
    runs-on: ubuntu-latest
    needs: [run-migrations, deploy-api, deploy-ml-engine, deploy-frontend]
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.skip_demo_seed != 'true'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @accountable-books/utils build

      - name: Build contracts artifacts
        run: pnpm --filter @accountable-books/contracts build

      - name: Apply demo data
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DIRECT_URL }}
          DATABASE_URL_NOPOOL: ${{ secrets.NEON_STAGING_DIRECT_URL }}
        run: |
          echo "🌱 Seeding demo data..."
          pnpm -F @accountable-books/api run demo:apply:staging:remote
          echo "✅ Demo data applied successfully"

  # Step 5: Deployment summary and notifications
  deployment-summary:
    runs-on: ubuntu-latest
    needs:
      [
        wait-for-ci,
        run-migrations,
        deploy-api,
        deploy-ml-engine,
        deploy-frontend,
        apply-demo-data,
      ]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "API URL: https://accountable-books-api-staging.fly.dev"
          echo "API Health: https://accountable-books-api-staging.fly.dev/health/ready"
          echo "ML Engine URL: https://accountable-books-ml-engine-staging.fly.dev"
          echo "ML Engine Health: https://accountable-books-ml-engine-staging.fly.dev/health"
          echo "Frontend URL: https://staging.getaccountable.com"
          echo ""
          echo "Job Status:"
          echo "- CI Wait: ${{ needs.wait-for-ci.result }}"
          echo "- Migrations: ${{ needs.run-migrations.result }}"
          echo "- API Deployment: ${{ needs.deploy-api.result }}"
          echo "- ML Engine Deployment: ${{ needs.deploy-ml-engine.result }}"
          echo "- Frontend Deployment: ${{ needs.deploy-frontend.result }}"
          echo "- Demo Data: ${{ needs.apply-demo-data.result }}"

      - name: Notify deployment status
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ needs.wait-for-ci.result }}" = "success" ] && \
             [ "${{ needs.run-migrations.result }}" = "success" ] && \
             [ "${{ needs.deploy-api.result }}" = "success" ] && \
             [ "${{ needs.deploy-ml-engine.result }}" = "success" ] && \
             [ "${{ needs.deploy-frontend.result }}" = "success" ] && \
             { [ "${{ needs.apply-demo-data.result }}" = "success" ] || \
               [ "${{ needs.apply-demo-data.result }}" = "skipped" ]; }; then
            echo "✅ Staging deployment completed successfully!"
          else
            echo "❌ Staging deployment failed. Check the logs for details."
            echo "Failed jobs:"
            [ "${{ needs.wait-for-ci.result }}" != "success" ] && echo "- CI Wait"
            [ "${{ needs.run-migrations.result }}" != "success" ] && echo "- Database Migrations"
            [ "${{ needs.deploy-api.result }}" != "success" ] && echo "- API Deployment"
            [ "${{ needs.deploy-ml-engine.result }}" != "success" ] && echo "- ML Engine Deployment"
            [ "${{ needs.deploy-frontend.result }}" != "success" ] && echo "- Frontend Deployment"
            [ "${{ needs.apply-demo-data.result }}" != "success" ] && \
              [ "${{ needs.apply-demo-data.result }}" != "skipped" ] && \
              echo "- Demo Data Seeding"
          fi
