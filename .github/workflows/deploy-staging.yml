name: Deploy Staging
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [staging]

  workflow_dispatch:
    inputs:
      skip_demo_seed:
        description: 'Skip demo data seeding'
        required: false
        default: false
        type: boolean

env:
  PNPM_VERSION: 10.15.0
  NODE_VERSION: 24

jobs:
  # Step 1: Run database migrations BEFORE deploying API
  run-migrations:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types from contracts
        run: pnpm run codegen

      - name: Build shared packages
        run: |
          pnpm --filter @accountable-books/api-types build
          pnpm --filter @accountable-books/utils build

      - name: Generate environment files
        run: pnpm --filter @accountable-books/api generate-env

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DIRECT_URL }}
        run: |
          echo "🔄 Running database migrations on staging..."
          pnpm -F @accountable-books/api run migrate:staging:remote
          echo "✅ Database migrations completed successfully"

  # Step 2: Deploy API only after migrations succeed
  deploy-api:
    runs-on: ubuntu-latest
    needs: run-migrations
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types from contracts
        run: pnpm run codegen

      - name: Build shared packages
        run: |
          pnpm --filter @accountable-books/api-types build
          pnpm --filter @accountable-books/utils build

      - name: Generate environment files
        run: pnpm --filter @accountable-books/api generate-env

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "🚀 Deploying API to Fly.io..."
          flyctl deploy \
            --app accountable-books-api-staging \
            --config fly.staging.toml \
            --strategy immediate
          echo "✅ API deployment completed"

      - name: Wait for API to be healthy
        run: |
          echo "⏳ Waiting for API health check..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f https://accountable-books-api-staging.fly.dev/health; then
              echo "✅ API is healthy"
              break
            fi
            echo "Attempt $((attempt + 1))/$max_attempts: API not ready yet..."
            sleep 10
            attempt=$((attempt + 1))
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ API health check failed after $max_attempts attempts"
            exit 1
          fi

  # Step 3: Deploy Frontend to Vercel only after API is healthy
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [run-migrations, deploy-api]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types from contracts
        run: pnpm run codegen

      - name: Build shared packages
        run: |
          pnpm --filter @accountable-books/api-types build
          pnpm --filter @accountable-books/utils build

      - name: Generate environment files
        run: pnpm --filter @accountable-books/web generate-env

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'

  # Step 4: Apply demo data only after both API and frontend are deployed
  apply-demo-data:
    runs-on: ubuntu-latest
    needs: [run-migrations, deploy-api, deploy-frontend]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) && github.event.inputs.skip_demo_seed != 'true' && !contains(github.event.head_commit.message, '[skip-seed]') }}
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types from contracts
        run: pnpm run codegen

      - name: Build shared packages
        run: |
          pnpm --filter @accountable-books/api-types build
          pnpm --filter @accountable-books/utils build

      - name: Apply demo data
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DIRECT_URL }}
        run: |
          echo "🌱 Seeding demo data..."
          pnpm -F @accountable-books/api run demo:apply:staging:remote -- --all
          echo "✅ Demo data applied successfully"

  # Step 5: Deployment summary and notifications
  deployment-summary:
    runs-on: ubuntu-latest
    needs: [run-migrations, deploy-api, deploy-frontend, apply-demo-data]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "API URL: https://accountable-books-api-staging.fly.dev"
          echo "API Health: https://accountable-books-api-staging.fly.dev/health"
          echo "Frontend URL: https://staging.getaccountable.com"
          echo ""
          echo "Job Status:"
          echo "- Migrations: ${{ needs.run-migrations.result }}"
          echo "- API Deployment: ${{ needs.deploy-api.result }}"
          echo "- Frontend Deployment: ${{ needs.deploy-frontend.result }}"
          echo "- Demo Data: ${{ needs.apply-demo-data.result }}"

      - name: Notify deployment status
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment completed successfully!"
          else
            echo "❌ Staging deployment failed. Check the logs for details."
            echo "Failed jobs:"
            [ "${{ needs.run-migrations.result }}" != "success" ] && echo "- Database Migrations"
            [ "${{ needs.deploy-api.result }}" != "success" ] && echo "- API Deployment"
            [ "${{ needs.deploy-frontend.result }}" != "success" ] && echo "- Frontend Deployment"
            [ "${{ needs.apply-demo-data.result }}" != "success" ] && echo "- Demo Data Seeding"
          fi
