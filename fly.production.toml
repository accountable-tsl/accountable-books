# Fly.io configuration for Accountable Books API (Production)
# This file configures the production deployment of the API service

app = "accountable-books-api"
primary_region = "iad"  # Washington DC (US East)

[build]
  dockerfile = "apps/api/infra/docker/Dockerfile.staging"  # We'll create a production Dockerfile later

[env]
  NODE_ENV = "production"
  PORT = "8080"  # Fly.io expects apps to listen on port 8080

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Keep running in production
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[processes]
  app = "node dist/src/server.js"

[[vm]]
  cpu_kind = "shared"
  cpus = 2  # More resources for production
  memory_mb = 2048

[metrics]
  port = 9091
  path = "/metrics"

# Production secrets will be set via: fly secrets set SECRET_NAME=value
# Example: fly secrets set JWT_ACCESS_SECRET=your-production-secret-here
