# Fly.io configuration for Accountable Books API (Production)
# This file configures the production deployment of the API service

app = "accountable-books-api"
primary_region = "iad"  # Washington DC (US East)

[build]
  dockerfile = "apps/api/infra/docker/Dockerfile.prod"  # We'll create a production Dockerfile later
  build-target = "runtime"

[env]
  NODE_ENV = "production"
  PORT = "8080"  # Fly.io expects apps to listen on port 8080
  BASE_DOMAIN = "getaccountable.com"
  BACKEND_URL = "https://api.getaccountable.com"
  FRONTEND_URL = "https://app.getaccountable.com"
  COOKIE_DOMAIN = ".getaccountable.com"

  # Worker configuration
  EMAIL_WORKER_CONCURRENCY = "5"
  TRANSACTION_SYNC_CONCURRENCY = "3"
  ENABLE_REDIS_MONITORING = "true"

[processes]
  web = "node dist/src/server.js"
  worker = "node dist/src/worker.js"
  scheduler = "node dist/src/scheduler.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  max_machines_running = 10
  processes = ["web"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    timeout = "2s"
    interval = "10s"
    grace_period = "20s"

[metrics]
  port = 9091
  path = "/metrics"

[compute]
  memory = "1024MB"
