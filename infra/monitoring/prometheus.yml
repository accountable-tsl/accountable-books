# Prometheus configuration for staging environment
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "rules/*.yml"

# Scrape configuration
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter for system metrics (if added)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # API application metrics (disabled until /metrics is implemented)
  # - job_name: 'api'
  #   static_configs:
  #     - targets: ['api:5000']
  #   metrics_path: '/metrics'
  #   scrape_interval: 30s
  #   scrape_timeout: 10s

  # ML engine metrics (disabled until exporter exists)
  # - job_name: 'ml-engine'
  #   static_configs:
  #     - targets: ['ml:8000']
  #   metrics_path: '/metrics'
  #   scrape_interval: 30s

  # Nginx metrics (requires nginx-prometheus-exporter) - disabled
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx:9113']
  #   scrape_interval: 30s

  # PostgreSQL metrics (requires postgres-exporter) - disabled
