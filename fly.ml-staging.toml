# Fly.io configuration for Accountable Books ML Engine (Staging)
# This file configures the staging deployment of the ML Engine service
# 
# Location: Project root (required for monorepo builds)
# Service: apps/ml-engine (Python/FastAPI ML Engine)
# Build: apps/ml-engine/infra/docker/Dockerfile

app = "accountable-books-ml-engine-staging"
primary_region = "iad"  # Washington DC (US East)

[build]
  dockerfile = "apps/ml-engine/infra/docker/Dockerfile"
  # Build context: Project root (required - Dockerfile copies apps/ml-engine/)
  build-target = "runtime"

[env]
  # Python runtime configuration
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  PYTHONPATH = "/workspace/apps/ml-engine"
  
  # Custom domain overrides
  BASE_DOMAIN = "getaccountable.com"
  
  # Optional: Model version overrides (if not set, uses latest from registry)
  # MODEL_VERSION_GLOBAL_INTENT_CLASSIFIER = "v260101-01-1.0.0"
  # MODEL_VERSION_TENANT_ACCOUNT_RANKER = "v260101-01-1.0.0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true # false in prod
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 2

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "20s"

# Secrets will be set via: fly secrets set SECRET_NAME=value
# Required secrets:
#   - BACKEND_URL: API staging URL (e.g., https://api-staging.getaccountable.com)
#   - REDIS_URL: Redis connection string (shared with API)
#
# Example:
#   fly secrets set BACKEND_URL=https://api-staging.getaccountable.com --app accountable-books-ml-engine-staging
#   fly secrets set REDIS_URL=redis://... --app accountable-books-ml-engine-staging
#
# Deployment: fly deploy --config fly.ml-staging.toml
# Documentation: docs/fly-deployment.md

