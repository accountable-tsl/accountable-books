[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "accountable-contracts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datamodel-code-generator>=0.36.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["schema*", "data*"]
exclude = ["node_modules*", "schema/ts*", "schema/json*", "data/source*", "data/generated/ts*"]

# Include JSON files as package data
[tool.setuptools.package-data]
"data.generated.json" = ["**/*.json"]