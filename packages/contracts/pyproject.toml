[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "accountable-contracts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=4.0.0",
    "datamodel-code-generator>=0.36.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["generated.py*", "schema.py*"]
exclude = ["node_modules*", "definitions*", "schema.ts*", "schema.json*"]