version: v2

clean: true

plugins:
  # Typescript generation
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: generated/ts
    opt:
      - esModuleInterop=true
      - importSuffix=.js
      - env=both
      - useOptionals=messages
      - outputServices=none
      - outputIndex=true

  # Python generation
  - remote: buf.build/protocolbuffers/python:v33.1
    out: generated/py
  - remote: buf.build/protocolbuffers/pyi:v33.1
    out: generated/py
