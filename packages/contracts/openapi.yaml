openapi: 3.0.3
info:
  title: Accountable Books API
  description: API for Accountable Books - Accounting and bookkeeping platform
  version: 1.0.0
  contact:
    name: Accountable Books Team
    email: support@getaccountable.com

servers:
  - url: https://api.getaccountable.com
    description: Production server
  - url: http://localhost:5000
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /auth/login:
    post:
      summary: User login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
                password:
                  type: string
                  format: password
                  example: 'password123'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: '123e4567-e89b-12d3-a456-426614174000'
                          email:
                            type: string
                            example: 'user@example.com'
                          firstName:
                            type: string
                            example: 'John'
                          lastName:
                            type: string
                            example: 'Doe'
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      summary: User logout
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: User authentication endpoints
