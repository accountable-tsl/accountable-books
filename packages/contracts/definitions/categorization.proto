syntax = "proto3";

package accountable.contracts.categorization;

import "google/protobuf/struct.proto";

// Enriched transaction passed to the ML engine.
message EnrichedTransaction {
  string version = 1;
  EnrichedIds ids = 2;
  EnrichedTxRaw raw = 3;
  EnrichedTxNormalized normalized = 4;
  CompanyContext context = 5;
  Historical historical = 6;
  Signals signals = 7;
  Temporal temporal = 8;
  FeedbackSummary feedback_summary = 9;
  Metadata metadata = 10;
}

message EnrichedIds {
  string bank_transaction_id = 1;
  string bank_transaction_batch_id = 2;
  string company_uuid = 3;
  string bank_account_id = 4;
  string bank_account_coa_id = 5;
  string contact_id = 6;
  string enrichment_job_id = 7;
}

message EnrichedTxRaw {
  string date = 1; // YYYY-MM-DD
  string description = 2;
  double amount_native = 3;
  double system_ex_rate = 4;
  double amount_reporting = 5;
  string currency_code = 6;
  Direction direction = 7;
  string source = 8;
  google.protobuf.Struct metadata = 9;
}

message EnrichedTxNormalized {
  string description = 1;
  repeated string description_tokens = 2;
  string contact_name = 3;
  string contact_fingerprint = 4;
  ContactMatchConfidence contact_match_confidence = 5;
  ContactType contact_type = 6;
  string normalized_reference = 7;
  string global_contact_name = 8;
  repeated string global_contact_category_hints = 9;
}

message CompanyContext {
  string company_name = 1;
  string type = 2;
  string description = 3;
  string website = 4;
  string country_id = 5;
  string country_code = 6;
  string industry = 7;
  string accounting_basis = 8;
  string reporting_framework = 9;
  string reporting_currency_id = 10;
  string reporting_currency_code = 11;
  string default_timezone = 12;
  string company_settings_checksum = 13;
  string coa_snapshot_version = 14;
  string coa_snapshot_id = 15;
  string coa_snapshot_checksum = 16;
  string cached_at = 17; // ISO datetime
}

message Historical {
  BankContactStatsSnapshot bank_contact_stats_snapshot = 1;
}

message BankContactStatsSnapshot {
  string stats_row_id = 1;
  int32 stats_replay_seq = 2;
  string stats_snapshot_checksum = 3;
  string snapshot_captured_at = 4; // ISO datetime
  RollingStats totals = 5;
  RollingStats rolling_30d = 6;
  RollingStats rolling_90d = 7;
  string last_transaction_id = 8;
  string last_transaction_date = 9; // ISO date
}

message RollingStats {
  int32 transaction_count = 1;
  double amount_native_sum = 2;
  double amount_reporting_sum = 3;
  double avg_amount_native = 4;
  double avg_amount_reporting = 5;
  double stddev_amount_native = 6;
  double stddev_amount_reporting = 7;
}

message Signals {
  bool likely_split = 1;
  bool likely_trf_btw_accounts = 2;
  repeated string notes = 3;
  bool requires_vat_check = 4;
  bool requires_fx_review = 5;
}

message Temporal {
  int32 day_of_week = 1;
  int32 day_of_month = 2;
  int32 calendar_month = 3;
  int32 calendar_quarter = 4;
  int32 fiscal_month = 5;
  int32 fiscal_quarter = 6;
  FiscalPeriod fiscal_period = 7;
}

message FiscalPeriod {
  string year_start = 1;
  string year_end = 2;
  string quarter_start = 3;
  string quarter_end = 4;
  string month_start = 5;
  string month_end = 6;
}

message FeedbackSummary {
  string last_posted_at = 1;
  string last_posted_coa_id = 2;
  double acceptance_ratio_90d = 3;
  double custom_exchange_rate = 4;
  string user_override_contact_id = 5;
  string user_override_notes = 6;
}

message Metadata {
  string source = 1;
  string enriched_at = 2; // ISO datetime
  int32 enrichment_latency_ms = 3;
  string enrichment_version = 4;
  string status = 5;
  string error_message = 6;
  string processing_context = 7;
  int32 stats_replay_seq = 8;
  string replay_reason = 9;
  string recomputed_at = 10; // ISO datetime
  string stats_snapshot_checksum = 11;
}

// ------------------------------
// ML Prediction Contracts
// ------------------------------

message MLPredictionRequest {
  EnrichedTransaction enriched_transaction = 1;
  CompanyContext company_context = 2;
}

message MLPredictionResponse {
  bool success = 1;
  repeated MLPrediction predictions = 2;
  string model_version = 3;
  int64 latency_ms = 4;
  string error = 5;
}

message MLPrediction {
  int32 rank = 1;
  double confidence = 2;
  string model_version = 3;
  google.protobuf.Struct explanation = 4;
  google.protobuf.Struct metadata = 5;
  repeated MLPredictedLine lines = 6;
}

message MLPredictedLine {
  EntryType entry_type = 1;
  string coa_id = 2;
  string project_id = 3;
  double amount_native = 4;
  double amount_reporting = 5;
  string currency_code = 6;
  string description = 7;
  bool is_bank_leg = 8;
  SplitType split_type = 9;
  double split_value = 10;
  google.protobuf.Struct metadata = 11;
}

// Enums
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  INFLOW = 1;
  OUTFLOW = 2;
}

enum ContactMatchConfidence {
  CONTACT_MATCH_CONFIDENCE_UNSPECIFIED = 0;
  HIGH = 1;
  MEDIUM = 2;
  LOW = 3;
  UNMATCHED = 4;
}

enum ContactType {
  CONTACT_TYPE_UNSPECIFIED = 0;
  VENDOR = 1;
  CUSTOMER = 2;
  EMPLOYEE = 3;
  BUSINESS_OWNER = 4;
  INDIVIDUAL_SELF = 5;
  UNKNOWN = 6;
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  DEBIT = 1;
  CREDIT = 2;
}

enum SplitType {
  SPLIT_TYPE_UNSPECIFIED = 0;
  BANK = 1;
  AMOUNT = 2;
  PERCENTAGE = 3;
  REMAINDER = 4;
}
