login:
  post:
    summary: User login
    description: Authenticate user with email and password
    operationId: loginUser
    tags:
      - Authentication
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth/LoginForm.yaml'
    responses:
      '200':
        description: Login successful
        headers:
          Set-Cookie:
            description: >
              Two cookies are set: accessToken (short-lived, httpOnly) and refreshToken (long-lived, httpOnly)
              Attributes: Secure, HttpOnly, SameSite, Path.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth/LoginResponse.yaml'
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common/ApiResponse.yaml'
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common/ApiResponse.yaml'

logout:
  post:
    summary: User logout
    description: Logout user by invalidating their session tokens
    operationId: logoutUser
    tags:
      - Authentication
    security:
      - CookieAuth: []
    responses:
      '200':
        description: Logout successful
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common/ApiResponse.yaml'

refresh:
  post:
    summary: Refresh access token
    description: Refresh the access token using a valid refresh token
    operationId: refreshToken
    tags:
      - Authentication
    security:
      - CookieAuth: []
    responses:
      '200':
        description: Token refreshed successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth/RefreshResponse.yaml'

me:
  get:
    summary: Get current user
    description: Retrieve the current authenticated user's profile information
    operationId: getCurrentUser
    tags:
      - Authentication
    security:
      - CookieAuth: []
      - CsrfToken: []
    responses:
      '200':
        description: Current user data
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth/MeResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common/ApiResponse.yaml'
