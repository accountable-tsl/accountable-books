# Fly.io configuration for Accountable Books API (Staging)
# This file configures the staging deployment of the API service
# 
# Location: Project root (required for monorepo builds)
# Service: apps/api (Node.js/Express API)
# Build: apps/api/infra/docker/Dockerfile.staging

app = "accountable-books-api-staging"
primary_region = "iad"  # Washington DC (US East)

[build]
  dockerfile = "apps/api/infra/docker/Dockerfile.staging"
  # Build context: Project root (required for monorepo dependencies)
  build-target = "runtime"

[env]
  # Essential overrides - these override values from .env.staging
  NODE_ENV = "staging"
  PORT = "5001"
  
  # Custom domain overrides
  BASE_DOMAIN = "getaccountable.com"
  BACKEND_URL = "https://api-staging.getaccountable.com"
  FRONTEND_URL = "https://staging.getaccountable.com"
  COOKIE_DOMAIN = ".getaccountable.com"
  
  # Worker configuration (optimized for low Redis usage)
  ENABLE_EMAIL_WORKER = "true"
  ENABLE_TRANSACTION_SYNC = "false"
  EMAIL_WORKER_CONCURRENCY = "5"
  TRANSACTION_SYNC_CONCURRENCY = "3"
  
  # Redis monitoring (enabled in staging to track usage)
  ENABLE_REDIS_MONITORING = "true" 

[processes]
  web = "node dist/src/server.js"
  worker = "node dist/src/worker.js"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = true # false in prod
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 2
  processes = ["web"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "20s"
  
[[checks]]
  type = "tcp"
  port = 9091
  path = "
  interval = "30s"
  timeout = "10s"
  processes = ["worker"]

[metrics]
  port = 9091
  path = "/metrics"

# Secrets will be set via: fly secrets set SECRET_NAME=value
# Example: fly secrets set JWT_ACCESS_SECRET=your-secret-here
#
# Deployment: ./scripts/deploy-fly-staging.sh deploy
# Documentation: FLY_README.md
