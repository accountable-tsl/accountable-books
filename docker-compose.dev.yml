name: acct-dev

services:
  db:
    image: iamtemi/accountable:pg17-cron-vector-v1
    container_name: books-db-dev
    env_file:
      - ./apps/api/.env.local
    ports:
      - 5433:5432
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: iamtemi/accountable:pg17-cron-vector-v1
    env_file:
      - ./apps/api/.env.local
    environment:
      EXPECTED_POSTGRES_DB: accountable_books
      PGHOST: db
      PGPORT: 5432
    volumes:
      - ./infra/postgres/image/01-setup-databases.sh:/usr/local/bin/setup-databases.sh:ro
    entrypoint: ['/bin/bash', '/usr/local/bin/setup-databases.sh']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  redis:
    image: redis:8.0-alpine
    container_name: books-redis-dev
    ports:
      - 6380:6379
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
