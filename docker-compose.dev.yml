services:
  db:
    build: ./infra/postgres
    container_name: accountable-books-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accountable_books
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.0.3-alpine
    container_name: accountable-books-redis
    ports:
      - 6380:6379
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
