services:
  db:
    image: iamtemi/accountable:pg17-cron-vector-v1
    container_name: books-db-dev
    env_file:
      - ./apps/api/.env.local
    ports:
      - 5433:5432
    entrypoint: ['docker-entrypoint.sh']
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=$${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.0.3-alpine
    container_name: accountable-books-redis
    ports:
      - 6380:6379
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/infra/docker/Dockerfile.dev
    container_name: accountable-books-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 5000:5000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/api-types/node_modules
      - /app/packages/utils/node_modules
    environment:
      - NODE_ENV=local
      - PORT=5000
      # Service-to-service DB/Redis inside Docker network
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=accountable_books
      - DB_USER=user
      - DB_PASSWORD=password
      - DATABASE_URL=postgresql://user:password@db:5432/accountable_books
      - REDIS_URL=redis://redis:6379
      # Public URLs (from host)
      - BACKEND_URL=http://localhost:5000
      - FRONTEND_URL=http://localhost:5173
      # Local cookie domain for dev
      - COOKIE_DOMAIN=localhost
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/infra/docker/Dockerfile.dev
    container_name: accountable-books-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 5173:5173
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/api-types/node_modules
      - /app/packages/utils/node_modules
    environment:
      - NODE_ENV=local
      - VITE_BACKEND_URL=http://localhost:5000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5173/']
      interval: 30s
      timeout: 10s
      retries: 3

  ml-engine:
    build:
      context: .
      dockerfile: apps/ml-engine/infra/docker/Dockerfile.dev
    container_name: accountable-books-ml
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 8000:8000
    volumes:
      - ./apps/ml-engine:/app
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_dev:
  redis_data_dev:
