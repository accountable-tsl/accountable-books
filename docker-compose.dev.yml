networks:
  accountable-dev:
    driver: bridge
services:
  db:
    image: iamtemi/accountable:pg17-cron-vector-v1
    container_name: books-db-dev
    env_file:
      - ./apps/api/.env.local
    ports:
      - 5433:5432
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - accountable-dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.0-alpine
    container_name: books-redis-dev
    ports:
      - 6380:6379
    volumes:
      - redis_data_dev:/data
    networks:
      - accountable-dev
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/infra/docker/Dockerfile.dev
    container_name: books-api-dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 5000:5000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/api-types/node_modules
      - /app/packages/utils/node_modules
    env_file:
      - ./apps/api/.env.local
    environment:
      - NODE_ENV=local
      - PORT=5000
      - DB_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - DB_PORT=5432
    networks:
      - accountable-dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/infra/docker/Dockerfile.dev
    container_name: books-web-dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 5173:5173
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/api-types/node_modules
      - /app/packages/utils/node_modules
    environment:
      - NODE_ENV=local
      - VITE_BACKEND_URL=http://api.lvh.me:5000
    networks:
      - accountable-dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5173/']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ml-engine:
    build:
      context: .
      dockerfile: apps/ml-engine/infra/docker/Dockerfile.dev
    container_name: books-ml-dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 8000:8000
    volumes:
      - ./apps/ml-engine:/app
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
