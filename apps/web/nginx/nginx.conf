# Production-Ready Nginx Configuration
# Save as: apps/web/nginx.conf

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security Headers
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:5000 https:; frame-ancestors 'none';" always;

  # Gzip Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # Request size limit (adjust based on your needs)
  client_max_body_size 10M;

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Don't cache HTML
  location ~* \.(html)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
  }

  # API Proxy (uncomment to avoid CORS)
  # location /api {
  #   proxy_pass http://api:5000;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_connect_timeout 60s;
  #   proxy_send_timeout 60s;
  #   proxy_read_timeout 60s;
  # }

  # WebSocket support (uncomment if needed)
  # location /ws {
  #   proxy_pass http://api:5000;
  #   proxy_http_version 1.1;
  #   proxy_set_header Upgrade $http_upgrade;
  #   proxy_set_header Connection "upgrade";
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  # SPA routing - must be last
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security: Deny access to sensitive files
  location ~ /\. {
    deny all;
  }

  location ~ \.(env|log|conf|yml|yaml|toml|ini|sh|bak|backup|sql)$ {
    deny all;
  }
}