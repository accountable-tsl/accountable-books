server {
    listen 80;
    server_name _;

    # Set the document root and default index file.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try to serve the file directly; fallback to index.html for SPAs.
        try_files $uri $uri/ /index.html;

        # Security Headers (applied always)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
        add_header Permissions-Policy "geolocation=(), midi=(), camera=(), usb=()" always;
    }

    location /api/ {
        # Proxy API requests to the backend service.
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Enable gzip compression for performance.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
}