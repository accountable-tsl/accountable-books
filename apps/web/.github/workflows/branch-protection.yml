name: Branch Protection

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check-reviews:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Check for Reviews
        uses: actions/github-script@v5
        with:
          script: |
            const { data: reviews } = await github.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const approvedReviews = reviews.filter(review => review.state === 'APPROVED');
            if (approvedReviews.length < 2) {
              core.setFailed("Pull request requires at least two approved reviews.");
            }

  check-branch:
    runs-on: ubuntu-latest
    needs: check-reviews
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Ensure Only `develop` Can Be Merged into `main`
        run: |
          base_branch=$(jq -r .pull_request.base.ref < "$GITHUB_EVENT_PATH")
          head_branch=$(jq -r .pull_request.head.ref < "$GITHUB_EVENT_PATH")
          if [ "$base_branch" = "main" ] && [ "$head_branch" != "develop" ]; then
            echo "Only 'develop' branch can be merged into 'main'."
            exit 1
          fi

  prevent-direct-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Prevent Direct Push to Main
        run: |
          if [ "${GITHUB_REF##*/}" == "main" ]; then
            commits=$(git log --oneline --merges -1)
            if [[ "$commits" != *"Merge branch 'develop'"* ]]; then
              echo "Direct pushes to main are not allowed."
              exit 1
            fi
          fi
