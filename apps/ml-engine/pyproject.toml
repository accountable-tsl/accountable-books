[project]
name = "ml-engine"
version = "0.1.0"
description = "Accountable Books ML Engine - AI-native transaction categorization and financial insights"
authors = [{ name = "Accountable Books Team" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
  "fastapi==0.136.3",
  "uvicorn[standard]==0.48.0",
  "pydantic==2.13.4",
  "scikit-learn==1.8.0",
  "pandas==3.0.3",
  "numpy==2.4.6",
  "joblib==1.5.3",
  "redis==7.4.0",
  "sentence-transformers==5.5.1",
  "accountable-contracts",
]

[project.scripts]
ml-engine = "ml_engine.main:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.15.14,<0.16",
  "pytest-testmon>=2.2.0,<3",
]

[tool.uv.sources]
accountable-contracts = { path = "../../packages/contracts", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PTH"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"