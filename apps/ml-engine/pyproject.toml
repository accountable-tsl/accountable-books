[tool.poetry]
name = "ml_engine"
version = "0.1.0"
description = "Accountable Books ML Engine - AI-native transaction categorization and financial insights"
authors = ["Accountable Books Team"]
readme = "README.md"
packages = [{ include = "ml_engine" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.9.0"
scikit-learn = "^1.5.0"
pandas = "^2.2.0"
numpy = "^2.0.0"
joblib = "^1.4.0"
redis = "^7.1.0"
sentence-transformers = "^5.1.2"
accountable-contracts = {path = "../../packages/contracts", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.24.0"
black = "^24.0.0"
ruff = "^0.6.0"
pytest-testmon = "^2.2.0"

[tool.poetry.scripts]
ml-engine = "ml_engine.main:main"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 88
select = ["E", "F", "I", "UP", "PTH"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
