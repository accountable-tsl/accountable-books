[tool.poetry]
name = "ml-engine"
version = "0.1.0"
description = "Accountable Books ML Engine (FastAPI)"
authors = ["Accountable Books <engineering@accountablebooks.example>"]
package-mode = true

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
httpx = "^0.27.0"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

