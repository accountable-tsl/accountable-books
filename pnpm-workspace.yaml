packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  typescript: 5.9.2
  eslint: 9.33.0
  prettier: 3.6.2
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/cli': true
  bcrypt: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  unrs-resolver: true
