openapi: 3.0.3
info:
  title: Accountable Books API
  description: API for Accountable Books - Accounting and bookkeeping platform
  version: 1.0.0
  contact:
    name: Accountable Books Team
    email: support@getaccountable.com

servers:
  - url: https://api.getaccountable.com
    description: Production server
  - url: http://localhost:5000
    description: Local development server

paths:
  /health:
    $ref: './paths/health.yaml'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /auth/me:
    $ref: './paths/auth.yaml#/me'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HTTP-only refresh token cookie
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF protection token

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: User authentication endpoints
