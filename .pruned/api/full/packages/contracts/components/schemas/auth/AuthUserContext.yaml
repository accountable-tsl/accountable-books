type: object
required: [id, email, firstname, currentCompanyId, companies, currentCompany]
properties:
  id: { type: string, format: uuid }
  email: { type: string, format: email }
  firstname: { type: string }
  lastname: { type: string }
  isPlatformUser: { type: boolean }
  platformUserKey: { type: string, nullable: true }
  currentCompanyId: { type: string, format: uuid }
  currentCompany: { $ref: './AuthCompanyContext.yaml' }
  companies:
    type: array
    items: { $ref: './AuthCompanyContext.yaml' }
