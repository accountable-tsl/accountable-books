name: acct-books-staging

networks:
  books-staging:
    driver: bridge

volumes:
  postgres_data_stg:
  redis_data_stg:

services:
  db:
    image: iamtemi/accountable:pg17-cron-vector-v1
    container_name: books-db-staging
    env_file:
      - ./apps/api/.env.staging
      - ./apps/api/.env.secrets.staging
    networks:
      - books-staging
    volumes:
      - postgres_data_stg:/var/lib/postgresql/data
      - ./backups:/var/backups
    ports:
      - 5434:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Simple Redis for staging
  redis:
    image: redis:8.0-alpine
    container_name: books-redis-staging
    env_file:
      - ./apps/api/.env.staging
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data_stg:/data
    networks:
      - books-staging
    healthcheck:
      test: ['CMD', 'sh', '-lc', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/infra/docker/Dockerfile
    container_name: books-api-migrate-staging
    networks:
      - books-staging
    env_file:
      - ./apps/api/.env.staging
      - ./apps/api/.env.secrets.staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['sh', '-c', 'cd apps/api && npx knex migrate:latest --env staging']
    restart: 'no'

  # API service - start after migrations complete
  api:
    build:
      context: .
      dockerfile: apps/api/infra/docker/Dockerfile
    container_name: books-api-staging
    networks:
      - books-staging
    env_file:
      - ./apps/api/.env.staging
      - ./apps/api/.env.secrets.staging
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ml:
    # image: ghcr.io/accountable-tsl/accountable-books/ml:${GIT_SHA}
    build:
      context: .
      dockerfile: apps/ml-engine/infra/docker/Dockerfile
    container_name: books-ml-staging
    networks:
      - books-staging
    depends_on:
      api:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - ENV=staging
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Web frontend - build only
  web:
    # image: ghcr.io/accountable-tsl/accountable-books/web:${GIT_SHA}
    build:
      context: .
      dockerfile: apps/web/infra/docker/Dockerfile
    container_name: books-web-staging
    env_file:
      - ./apps/web/.env.staging
    networks:
      - books-staging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 80:80 # only public port
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
