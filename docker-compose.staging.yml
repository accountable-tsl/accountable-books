networks:
  accountable-staging:
    driver: bridge

services:
  # Simple PostgreSQL for staging
  db:
    image: iamtemi/accountable:pg17-cron-vector-v1
    container_name: books-db-staging
    env_file:
      - ./apps/api/.env.staging
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
      - ./backups:/var/backups
    networks:
      - accountable-staging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Simple Redis for staging
  redis:
    image: redis:8.0-alpine
    container_name: accountable-staging-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_staging:/data
    networks:
      - accountable-staging
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # API service - run migration then start server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        - NODE_ENV=staging
    container_name: accountable-staging-api
    env_file:
      - ./apps/api/.env.staging
    environment:
      - NODE_ENV=staging
      - PORT=5000
    ports:
      - '5000:5000'
    networks:
      - accountable-staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migrate:staging && node dist/server.js"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

    # Web frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NODE_ENV=staging
        - VITE_BACKEND_URL=${STAGING_API_URL:-http://api:5000}
    container_name: accountable-staging-web
    ports:
      - '3000:80'
    networks:
      - accountable-staging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ml-engine:
    build:
      context: .
      dockerfile: apps/ml-engine/Dockerfile
      args:
        - ENV=staging
    container_name: accountable-staging-ml
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8000:8000'
    networks:
      - accountable-staging
    environment:
      - PYTHONPATH=/app
      - ENV=staging
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data_staging:
    driver: local
  redis_data_staging:
    driver: local
