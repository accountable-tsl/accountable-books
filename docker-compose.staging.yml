name: acct-staging

networks:
  books-staging:
    driver: bridge

volumes:
  postgres_data_stg:
  redis_data_stg:

services:
  db:
    image: iamtemi/accountable:pg17-cron-vector-v1
    container_name: books-db-staging
    env_file:
      - ./apps/api/.env.staging
      - ./apps/api/.env.secrets.staging
    networks:
      - books-staging
    volumes:
      - postgres_data_stg:/var/lib/postgresql/data
      - ./backups:/var/backups
    ports:
      - 5434:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.0-alpine
    container_name: books-redis-staging
    command: sh -c 'redis-server --appendonly yes --save "" --requirepass "$$REDIS_PASSWORD"'
    environment:
      - REDIS_PASSWORD=SomeLocalRedisPassword
    ports:
      - 6384:6379
    volumes:
      - redis_data_stg:/data
    networks:
      - books-staging
    healthcheck:
      test: ['CMD', 'sh', '-lc', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/infra/docker/Dockerfile.staging
    container_name: books-api-staging
    env_file:
      - ./apps/api/.env.staging
      - ./apps/api/.env.secrets.staging
    ports:
      - '5001:5001'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - books-staging
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/infra/docker/Dockerfile.staging
      target: runtime # Use runtime target
    container_name: books-web-staging
    env_file:
      - ./apps/web/.env.staging
    environment:
      - NODE_ENV=staging
    ports:
      - '3000:80'
    depends_on:
      api:
        condition: service_started
    networks:
      - books-staging
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
